name: Build BlackBugsAI APK (clean)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0) — leave blank to just build'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk-clean.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@c5199ef5184c396e48e981bb0a6e5698e8755063  # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter manually (no third-party action)
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.24.5 --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish to Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@dfbed29c3880da6da3369ae2717e92a70b87a503  # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: android_app/build/app/outputs/flutter-apk/app-release.apk
