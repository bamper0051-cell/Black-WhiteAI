name: Build BlackBugsAI APK (clean)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0) — leave blank to just build'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk-clean.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # pinned v4

      - name: Install Java 17 (manual, no action)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Flutter 3.24.5 (manual)
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.24.5 --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter pub get

      - name: Build release APK
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build apk --release

      - name: Move APK to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp android_app/build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/BlackBugsAI.apk"
        env:
          GITHUB_WORKSPACE: ${{ secrets.GITHUB_WORKSPACE || github.workspace }}

      - name: Publish to Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.release_tag }}" \
            --repo ${{ github.repository }} \
            --title "${{ github.event.inputs.release_tag }}" \
            --notes "Automated Flutter APK build" \
            "$GITHUB_WORKSPACE/artifacts/BlackBugsAI.apk"
